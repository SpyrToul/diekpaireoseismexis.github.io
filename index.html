<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ΔΙΕΚΠΕΡΑΙΩΣΕΙΣ ΜΕΞΗΣ</title>

    <style>
        /* =========================
           General
           ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           Background Cars
           ========================= */

        .bg-cars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            z-index: 0;
            pointer-events: none;
        }

        .bg-cars use {
            opacity: 0.16;
        }


        /* =========================
           Personal Card
           ========================= */

        .card {
            position: relative;
            z-index: 1;

            background-color: white;

            width: 90%;
            max-width: 500px;

            padding: 50px 40px;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }


        /* =========================
           Name & Profession
           ========================= */

        .name {
            font-size: 32px;
            font-weight: 600;

            margin-bottom: 10px;
        }

        .profession {
            font-size: 18px;
            color: #777;

            margin-bottom: 35px;
        }


        /* =========================
           Contact Information
           ========================= */

        .contact {
            display: flex;
            flex-direction: column;

            gap: 15px;
        }

        .contact a {
            color: #333;
            text-decoration: none;

            font-size: 16px;

            padding: 12px;

            border-radius: 6px;

            transition: background-color 0.2s;
        }

        .contact a:hover {
            background-color: #f0f0f0;
        }


        /* =========================
           Company Information
           ========================= */

        .company-info {
            margin-top: 35px;
            padding-top: 25px;

            border-top: 1px solid #eee;

            display: flex;
            flex-direction: column;

            gap: 8px;

            font-size: 14px;
            color: #555;
        }

        .company-info .label {
            font-weight: 600;
            color: #222;
        }
    </style>
</head>

<body>

    <!-- Background cars -->
    <svg class="bg-cars" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800" aria-hidden="true">
        <defs>
            <symbol id="car" viewBox="0 0 200 80">
                <path fill="#1f4e79" fill-rule="evenodd" d="M8 58 V47 Q8 41 15 39 L46 33 L66 14 Q69 10 75 10 H125 Q131 10 135 14 L156 33 L185 39 Q193 41 193 48 V58 Z
                    M74 17 L56 33 H98 V17 Z M106 17 V33 H146 L128 17 Z"/>
                <circle cx="50" cy="58" r="15" fill="#1f4e79"/>
                <circle cx="150" cy="58" r="15" fill="#1f4e79"/>
                <circle cx="50" cy="58" r="6" fill="#f5f5f5"/>
                <circle cx="150" cy="58" r="6" fill="#f5f5f5"/>
            </symbol>
        </defs>

        <use href="#car" x="40"  y="60"  width="300" height="120"/>
        <use href="#car" x="820" y="120" width="340" height="136"/>
        <use href="#car" x="430" y="20"  width="200" height="80"/>
        <use href="#car" x="-20" y="360" width="360" height="144"/>
        <use href="#car" x="860" y="400" width="300" height="120"/>
        <use href="#car" x="400" y="640" width="320" height="128"/>
        <use href="#car" x="880" y="650" width="220" height="88"/>
    </svg>

    <div class="card">

        <h1 class="name">
            ΕΛΕΥΘΕΡΙΟΣ ΜΕΞΗΣ ΜΟΝΟΠΡΟΣΩΠΗ Ι.Κ.Ε.
        </h1>

        <p class="profession">
            ΔΙΕΚΠΕΡΑΙΩΣΕΙΣ
        </p>

        <div class="contact">

            <!-- <a href="tel:+306900000000">
                +30 690 000 0000
            </a> -->

            <a href="mailto:your@email.com">
                elmexis@hotmail.com
            </a>

        </div>

        <div class="company-info">

            <p>
                <span class="label">ΕΔΡΑ:</span>
                ΑΘΗΝΑ
            </p>

            <p>
                <span class="label">Αριθμός ΓΕΜΗ:</span>
                196304003000
            </p>

        </div>

    </div>

</body>
</html>
